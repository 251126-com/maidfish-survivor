<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端适配：禁止缩放，视口铺满，刘海屏安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>鲸鱼娘 · 割草求生</title>
  <!-- 内联空 favicon，避免浏览器请求 /favicon.ico 产生 404 -->
  <link rel="icon" href="data:," />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a1420;
      overflow: hidden;
      touch-action: none;          /* 禁止浏览器默认手势（滚动/缩放），触摸全交给游戏 */
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { width: 100%; height: 100%; }
    /* v0.9.1 HUD 安全区：body 按 env() 内边距收缩，#game(FIT 父容器)随之缩小，
       Phaser 等比 FIT 自动把画布居中到安全区内——刘海/Home 条不遮挡 HUD 顶部按钮。
       无凹口的桌面/普通手机 env()=0，布局与旧版完全一致。 */
    @supports (padding: env(safe-area-inset-top)) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }
    }
    #game canvas { display: block; }

    /* 竖屏手机提示：横屏体验最佳，竖屏时给出转屏引导（不拦截触摸） */
    #rotate-hint {
      display: none;
      position: fixed; inset: 0; z-index: 999;
      align-items: center; justify-content: center;
      background: rgba(10, 20, 32, 0.82);
      color: #7fd4ff;
      font-family: monospace;
      font-size: 20px;
      text-align: center;
      line-height: 1.9;
      pointer-events: none;   /* 不挡触摸，玩家仍可拖动 */
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>

  <!-- 加载覆盖层：资源加载期间可见，Boot 完成即隐藏；失败/超时有兜底提示（非固定等待） -->
  <div id="boot-loading">
    <div id="boot-spinner"></div>
    <div id="boot-loading-text">正在加载…</div>
  </div>
  <style>
    #boot-loading {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      background: #0a1420;
      font-family: monospace; color: #9fd8ff; font-size: 16px;
      transition: opacity 0.4s ease;
      user-select: none;
    }
    #boot-spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(63,143,232,0.25);
      border-top-color: #4a9fe8;
      border-radius: 50%;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
  <div id="game"></div>
  <div id="rotate-hint">↻ 请横屏游玩<br><span style="font-size:13px;color:#6f93b3">Rotate your device for the best experience</span></div>
  <script>
    // 仅在有触摸能力的设备上竖屏时显示横屏提示
    (function () {
      const hint = document.getElementById('rotate-hint');
      const update = function () {
        const portrait = window.innerHeight > window.innerWidth;
        const touch = (navigator.maxTouchPoints || 0) > 0;
        hint.style.display = (portrait && touch) ? 'flex' : 'none';
      };
      window.addEventListener('resize', update);
      update();
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // 加载覆盖层控制器：BootScene 通过 window.__LOADING 驱动（进度/完成/失败）。
    (function () {
      const el = document.getElementById('boot-loading');
      const txt = document.getElementById('boot-loading-text');
      const start = Date.now();
      let done = false;
      const hide = function () {
        if (done) return;
        done = true;
        el.style.opacity = '0';
        setTimeout(function () { el.style.display = 'none'; }, 400);
      };
      const showRetry = function (msg) {
        if (done) return;
        txt.textContent = msg;
        el.style.cursor = 'pointer';
        el.onclick = function () { location.reload(); };
      };
      window.__LOADING = {
        setProgress: function (p) { if (!done) txt.textContent = '正在加载 ' + Math.max(0, Math.min(100, Math.round(p * 100))) + '%'; },
        ready: function () { hide(); },
        error: function (key) { showRetry('资源加载失败（' + key + '）· 点击重试'); }
      };
      // 兜底：25 秒仍未就绪 → 给出可点击重试提示（不是把等待当修复，是防"永远转圈"）
      setTimeout(function () { showRetry('加载较慢，点击重试'); }, 25000);
    })();
  </script>

</body>
</html>
