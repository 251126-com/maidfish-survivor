<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端适配：禁止缩放，视口铺满，刘海屏安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>鲸鱼娘 · 割草求生</title>
  <!-- 内联空 favicon，避免浏览器请求 /favicon.ico 产生 404 -->
  <link rel="icon" href="data:," />
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0a1420;
      overflow: hidden;
      touch-action: none;          /* 禁止浏览器默认手势（滚动/缩放），触摸全交给游戏 */
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { width: 100%; height: 100%; }
    #game canvas { display: block; }

    /* 竖屏手机提示：横屏体验最佳，竖屏时给出转屏引导（不拦截触摸） */
    #rotate-hint {
      display: none;
      position: fixed; inset: 0; z-index: 999;
      align-items: center; justify-content: center;
      background: rgba(10, 20, 32, 0.82);
      color: #7fd4ff;
      font-family: monospace;
      font-size: 20px;
      text-align: center;
      line-height: 1.9;
      pointer-events: none;   /* 不挡触摸，玩家仍可拖动 */
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-hint">↻ 请横屏游玩<br><span style="font-size:13px;color:#6f93b3">Rotate your device for the best experience</span></div>
  <script>
    // 仅在有触摸能力的设备上竖屏时显示横屏提示
    (function () {
      const hint = document.getElementById('rotate-hint');
      const update = function () {
        const portrait = window.innerHeight > window.innerWidth;
        const touch = (navigator.maxTouchPoints || 0) > 0;
        hint.style.display = (portrait && touch) ? 'flex' : 'none';
      };
      window.addEventListener('resize', update);
      update();
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
